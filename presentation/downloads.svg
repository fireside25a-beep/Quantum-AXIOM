<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="248" viewBox="0 0 1280 248" role="img" aria-labelledby="title desc"><title id="title">Application and complete downloads</title><desc id="desc">Choose app executables and operating files, or the complete editable engine with tests and evidence. Both exclude repository presentation.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d2c"/><stop offset="1" stop-color="#080f1b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#67e7cd"/></marker></defs><rect x="1" y="1" width="1278" height="246" rx="22" fill="url(#bg)" stroke="#2c3e56"/><rect x="28" y="26" width="598" height="195" rx="16" fill="#101e2f" stroke="#2c3e56"/><text x="52" y="62" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="600">01 / RUN</text><text x="52" y="110" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">THE APP</text><text x="52" y="150" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Executables · SDK · examples · operating guide</text><text x="52" y="185" fill="#67e7cd" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">No repository artwork or CI files</text><rect x="654" y="26" width="598" height="195" rx="16" fill="#101e2f" stroke="#2c3e56"/><text x="678" y="62" fill="#ffc478" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="600">02 / REPRODUCE</text><text x="678" y="110" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="700">THE COMPLETE ENGINE</text><text x="678" y="150" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400">Editable source · tests · raw journals · provenance</text><text x="678" y="185" fill="#ffc478" font-family="DejaVu Sans,Arial,sans-serif" font-size="1