<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="264" viewBox="0 0 1280 264" role="img" aria-labelledby="title desc"><title id="title">Current verification results</title><desc id="desc">Three native compiler generations, sixteen guest levels, twelve seed generations restored and sixty-one exact rebuilt outputs.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d2c"/><stop offset="1" stop-color="#080f1b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#67e7cd"/></marker></defs><rect x="1" y="1" width="1278" height="262" rx="22" fill="url(#bg)" stroke="#2c3e56"/><text x="36" y="45" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="600">EXECUTED LOCALLY · SOURCE-LINKED EVIDENCE</text><text x="36" y="136" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="66" font-weight="700">3</text><text x="36" y="170" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="600">NATIVE GENERATIONS</text><text x="36" y="199" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Compiler source compiled by itself</text><path d="M328,71 L328,205" stroke="#2c3e56" fill="none"/><text x="346" y="136" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="66" font-weight="700">16</text><text x="346" y="170" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="600">GUEST LEVELS</text><text x="346" y="199" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Exclusive bank and bounded frames</text><path d="M638,71 L638,205" stroke="#2c3e56" fill="none"/><text x="656" y="136" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="66" font-weight="700">12</text><text x="656" y="170" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="600">RESTORED GENERATIONS</text><text x="656" y="199" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Complete retained seed histories</text><path d="M948,71 L948,205" stroke="#2c3e56" fill="none"/><text x="966" y="136" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="66" font-weight="700">61</text><text x="966" y="170" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="14" font-weight="600">EXACT REBUILD OUTPUTS</text><text x="966" y="199" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Fresh extraction, byte-for-byte</text><text x="36" y="235" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400">51 native machine programs · 728 full canonical-state comparisons · 51 journal round trips</text></svg>
