<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="582" viewBox="0 0 1280 582" role="img" aria-labelledby="title desc"><title id="title">Native compiler and quantum machine architecture</title><desc id="desc">Native source compiles to machine kernels and typed seeds. Machine execution creates canonical histories that native inverse and next-seed tools consume.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101d2c"/><stop offset="1" stop-color="#080f1b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10" fill="#67e7cd"/></marker></defs><rect x="1" y="1" width="1278" height="580" rx="22" fill="url(#bg)" stroke="#2c3e56"/><text x="36" y="43" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="15" font-weight="600">ONE CONNECTED EXECUTION PATH</text><text x="36" y="74" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="600">Source → native compiler → machine → recorded state</text><rect x="36" y="111" width="364" height="143" rx="16" fill="#101d2d" stroke="#2c3e56"/><text x="56" y="142" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600">01 / BOOTSTRAP INPUTS</text><text x="56" y="181" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600">ANF64 compiler source</text><text x="56" y="216" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Encoded seed + independent constructor</text><rect x="458" y="111" width="364" height="143" rx="16" fill="#101d2d" stroke="#2c3e56"/><text x="478" y="142" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600">02 / NATIVE COMPILER</text><text x="478" y="181" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600">Parses and emits fresh code</text><text x="478" y="216" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Three actual self-compilation generations</text><rect x="880" y="111" width="364" height="143" rx="16" fill="#101d2d" stroke="#2c3e56"/><text x="900" y="142" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600">03 / MACHINE KERNELS</text><text x="900" y="181" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600">Quantum VM + history ELFs</text><text x="900" y="216" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Freestanding native x86-64 executables</text><rect x="36" y="334" width="364" height="143" rx="16" fill="#101d2d" stroke="#2c3e56"/><text x="56" y="365" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600">04 / QUANTUM PROGRAM</text><text x="56" y="404" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600">Admitted typed seed</text><text x="56" y="439" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Initial bank + bounded instruction records</text><rect x="458" y="334" width="364" height="143" rx="16" fill="#101d2d" stroke="#2c3e56"/><text x="478" y="365" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600">05 / EXECUTION + JOURNAL</text><text x="478" y="404" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600">One owned quantum bank</text><text x="478" y="439" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Canonical control, entropy and state</text><rect x="880" y="334" width="364" height="143" rx="16" fill="#101d2d" stroke="#2c3e56"/><text x="900" y="365" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="13" font-weight="600">06 / INVERSE + NEXT SEED</text><text x="900" y="404" fill="#edf4fb" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="600">Checks actual inverse gates</text><text x="900" y="439" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400">Restore history/seed; emit next seed</text><path d="M400,182 L458,182" fill="none" stroke="#67e7cd" stroke-width="2" marker-end="url(#arrow)"/><path d="M822,182 L880,182" fill="none" stroke="#67e7cd" stroke-width="2" marker-end="url(#arrow)"/><path d="M520,254 L520,288 L218,288 L218,334" fill="none" stroke="#67e7cd" stroke-width="2" marker-end="url(#arrow)"/><path d="M1062,254 L1062,303 L640,303 L640,334" fill="none" stroke="#67e7cd" stroke-width="2" marker-end="url(#arrow)"/><path d="M400,405 L458,405" fill="none" stroke="#67e7cd" stroke-width="2" marker-end="url(#arrow)"/><path d="M822,405 L880,405" fill="none" stroke="#67e7cd" stroke-width="2" marker-end="url(#arrow)"/><text x="36" y="520" fill="#67e7cd" font-family="DejaVu Sans Mono,monospace" font-size="16" font-weight="400">16 guest levels  ·  1,024 fuel cap  ·  4,096-byte canonical states  ·  no KVM</text><text x="36" y="552" fill="#a0b1c8" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="400">Complete reversal retains overwritten information; the physical host and entropy device are not reversed.</text></svg>
