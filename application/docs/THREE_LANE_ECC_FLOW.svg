<svg xmlns="http://www.w3.org/2000/svg" width="960" height="655" viewBox="0 0 960 655" role="img" aria-label="Three-lane native error correction"><title>Three-lane native error correction</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="36" y="40" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="bold" text-anchor="start" fill="#162039">Native memory repair — physical three-lane replication in RW state</text><rect x="40" y="100" width="260" height="80" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="170" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#162039">Replica A — 768 bytes</text><text x="170" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#162039">64 rows × (X,Z,phase)</text><path d="M170,180 L490,251" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="340" y="100" width="260" height="80" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="470" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#162039">Replica B — 768 bytes</text><text x="470" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#162039">64 rows × (X,Z,phase)</text><path d="M470,180 L490,251" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="100" width="260" height="80" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="770" y="130" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#162039">Replica C — 768 bytes</text><text x="770" y="156" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#162039">64 rows × (X,Z,phase)</text><path d="M770,180 L490,251" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="254" width="360" height="75" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><text x="490" y="286" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#162039">Bitwise majority, repair all replicas</text><text x="490" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#162039">192 × u32 per replica</text><path d="M490,329 L490,385" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="387" width="360" height="72" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="490" y="415" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#162039">Verify FNV32 + complement</text><text x="490" y="440" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#162039">reject uncorrectable state</text><path d="M490,459 L490,504" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="310" y="506" width="360" height="72" rx="8" fill="#fef3c7" stroke="#64748b" stroke-width="1.5"/><text x="490" y="538" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#162039">Native H / S / CX update</text><text x="490" y="561" font-family="DejaVu Sans,Arial,sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#162039">reduplicate and commit</text><text x="42" y="624" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">Boundary: accidental one-lane fault model, not malicious or physical quantum error correction.</text></svg>