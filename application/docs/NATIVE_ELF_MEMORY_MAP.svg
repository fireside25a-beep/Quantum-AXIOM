<svg xmlns="http://www.w3.org/2000/svg" width="862" height="620" viewBox="0 0 862 620" role="img" aria-label="ELF64 actual native image map"><title>ELF64 actual native image map</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect width="100%" height="100%" fill="#f8fafc"/><text x="36" y="37" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="bold" text-anchor="start" fill="#162039">Native ELF64 image — extracted offsets and kernel segment permissions</text><rect x="36" y="70" width="790" height="70" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="55" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#162039">0x0000–0x0FFF: ELF header / program headers</text><text x="55" y="122" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">PT_LOAD header and metadata; RX mapping</text><rect x="36" y="154" width="790" height="70" rx="8" fill="#dbeafe" stroke="#64748b" stroke-width="1.5"/><text x="55" y="182" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#162039">0x1000: native opcode region (entry 0x401000)</text><text x="55" y="206" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">Machine instruction stream, no bytecode VM</text><rect x="36" y="238" width="790" height="70" rx="8" fill="#ccfbf1" stroke="#64748b" stroke-width="1.5"/><text x="55" y="266" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#162039">0x2000: resident logical header (128 bytes)</text><text x="55" y="290" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">Epoch, ternary triplicate, tags, entropy, syndrome</text><rect x="36" y="322" width="790" height="70" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="55" y="350" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#162039">0x2080–0x237F: Pauli tableau replica A (768 bytes)</text><text x="55" y="374" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">64 rows × 12 bytes: X, Z, phase</text><rect x="36" y="406" width="790" height="70" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="55" y="434" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#162039">0x2380–0x267F: Pauli tableau replica B (768 bytes)</text><text x="55" y="458" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">Independent correction lane</text><rect x="36" y="490" width="790" height="70" rx="8" fill="#dcfce7" stroke="#64748b" stroke-width="1.5"/><text x="55" y="518" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#162039">0x2680–0x297F: Pauli tableau replica C (768 bytes)</text><text x="55" y="542" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">Independent correction lane</text><text x="36" y="594" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="normal" text-anchor="start" fill="#162039">Actual image 10,624 bytes • RX (flags 5) and RW (flags 6) PT_LOAD segments</text></svg>