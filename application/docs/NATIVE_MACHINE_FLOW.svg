<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="690" viewBox="0 0 1040 690" role="img" aria-label="AXIOM native compiler and quantum state ownership"><rect width="1040" height="690" fill="#f8fafc"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#52657b"/></marker></defs><text x="30" y="35" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="bold" fill="#17243c">AXIOM G11 — native source, quantum ownership and reversible history</text><rect x="30" y="70" width="300" height="116" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="46" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Self-hosted ANF64 compiler</text><text x="46" y="121" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">3 executed native generations</text><text x="46" y="144" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">13,998 bytes; direct ELF execution</text><text x="46" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Native and quantum source dialects</text><rect x="390" y="70" width="280" height="116" rx="9" fill="#ccfbf1" stroke="#64748b"/><text x="406" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Native quantum machine</text><text x="406" y="121" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Typed seed / bounded quantum ISA</text><text x="406" y="144" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">No OS guest / hypervisor layer</text><text x="406" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Native inverse-compatible operations</text><rect x="730" y="70" width="280" height="116" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="746" y="98" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Canonical quantum bank</text><text x="746" y="121" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">32 virtual stabilizer qubits</text><text x="746" y="144" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">64 Pauli rows × 24 bytes</text><text x="746" y="167" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Exclusive owner; parent suspended</text><path d="M330,128 L390,128" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M670,128 L730,128" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="255" width="300" height="116" rx="9" fill="#e0e7ff" stroke="#64748b"/><text x="46" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Guest control frames</text><text x="46" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Code-view attenuation and fuel</text><text x="46" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">16 nested guest levels tested</text><text x="46" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Checked owner IDs and return PCs</text><rect x="390" y="255" width="280" height="116" rx="9" fill="#fef3c7" stroke="#64748b"/><text x="406" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Complete canonical snapshots</text><text x="406" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">4,096 bytes per committed state</text><text x="406" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Quantum + control + entropy</text><text x="406" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Original complete seed retained</text><rect x="730" y="255" width="280" height="116" rx="9" fill="#e0f2fe" stroke="#64748b"/><text x="746" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Hardware-coupled phase</text><text x="746" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Actual CPUID / RDSEED</text><text x="746" y="329" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Retained sample controls S / SDG</text><text x="746" y="352" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Explicit refusal; no weak fallback</text><path d="M330,313 L390,313" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M870,186 L870,255" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M730,313 L670,313" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M530,186 L530,255" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="30" y="450" width="300" height="116" rx="9" fill="#dbeafe" stroke="#64748b"/><text x="46" y="478" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Native reverse/history tool</text><text x="46" y="501" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Executes inverse quantum kernels</text><text x="46" y="524" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Checks recorded predecessors</text><text x="46" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Restores byte-exact seed/state</text><rect x="390" y="450" width="280" height="116" rx="9" fill="#dcfce7" stroke="#64748b"/><text x="406" y="478" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Next native seed</text><text x="406" y="501" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Executed final quantum bank</text><text x="406" y="524" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Retained hardware entropy word</text><text x="406" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">12 generations executed/restored</text><rect x="730" y="450" width="280" height="116" rx="9" fill="#f1f5f9" stroke="#64748b"/><text x="746" y="478" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="bold" fill="#17243c">Independent verification</text><text x="746" y="501" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Full canonical frame comparisons</text><text x="746" y="524" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Encoding and malformed-state tests</text><text x="746" y="547" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Forward/reverse source-bound evidence</text><path d="M530,371 L180,450" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M330,508 L390,508" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M670,508 L730,508" stroke="#52657b" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="30" y="625" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Source-derived software map. Quantum states are digital representations; physical coherence is not established.</text><text x="30" y="651" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="normal" fill="#17243c">Complete reversal retains overwritten information. It does not reverse host time or the physical entropy device.</text></svg>